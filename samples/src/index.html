    let t = Math.min(1, Math.max(0, (L - lo) / (hi - lo)));

const merc = (lon, lat, z) => { const n = 2 ** z * 256, r = lat * Math.PI / 180;
  return [(lon + 180) / 360 * n, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n]; };
async function loadDEM() {

  const tx0 = Math.floor(ax / 256), ty0 = Math.floor(ay / 256), tx1 = Math.floor(bx / 256), ty1 = Math.floor(by / 256);
  const w = (tx1 - tx0 + 1) * 256, h = (ty1 - ty0 + 1) * 256;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
  await Promise.all([...Array(tx1 - tx0 + 1).keys()].flatMap(i => [...Array(ty1 - ty0 + 1).keys()].map(async j => {
    const im = new Image(); im.src = `dem/${DEM_Z}/${tx0 + i}/${ty0 + j}.png`; await im.decode(); g.drawImage(im, i * 256, j * 256);
  })));
  const d = g.getImageData(0, 0, w, h).data, e = new Float32Array(w * h);

  return { ox: tx0 * 256, oy: ty0 * 256, w, h, e };
}
function elevAt(D, lon, lat) {
  let [x, y] = merc(lon, lat, DEM_Z); x -= D.ox + 0.5; y -= D.oy + 0.5;
  const i = Math.max(0, Math.min(D.w - 2, Math.floor(x))), j = Math.max(0, Math.min(D.h - 2, Math.floor(y))), fx = x - i, fy = y - j;
  const k = j * D.w + i;
  return (D.e[k] * (1 - fx) + D.e[k+1] * fx) * (1 - fy) + (D.e[k+D.w] * (1 - fx) + D.e[k+D.w+1] * fx) * fy;

let DEM, MASK, SHORE_PX;
function buildMask() {
  const rc = document.createElement('canvas'); rc.width = W; rc.height = H; const rg = rc.getContext('2d');
  rg.save(); rg.beginPath(); rg.rect(0, 0, W, Y(19.345)); rg.clip(); path(rg, BASIN_REGION, true); rg.fill(); rg.restore();
  path(rg, SOUTH_CAP, true); rg.fill();

  g.fillStyle = C.fresh; g.fillRect(0, 0, W, H); g.restore();
  g.fillStyle = 'rgba(190,215,250,0.16)';
  for (let y = 0; y < H; y += 8) for (let x = (y / 8 % 2) * 4; x < W; x += 8) { g.beginPath(); g.arc(x, y, 1, 0, 7); g.fill(); }
  g.globalCompositeOperation = 'destination-in'; g.drawImage(MASK, 0, 0);
  c.drawImage(lc, 0, 0);
  c.save(); c.globalAlpha = 0.9; c.drawImage(SHORE_PX, 0, 0); c.restore();
}

let ctx;
const at = (x, y) => [BOX.w + x / W * (BOX.e - BOX.w), BOX.n - y / H * (BOX.n - BOX.s)];
const sw = {
  fresh: (x, y) => { ctx.fillStyle = C.fresh; ctx.fillRect(x, y - 10, 44, 20); ctx.strokeStyle = C.shore; ctx.strokeRect(x, y - 10, 44, 20); },
  salt:  (x, y) => { ctx.fillStyle = C.salt;  ctx.fillRect(x, y - 10, 44, 20); ctx.strokeStyle = C.shore; ctx.strokeRect(x, y - 10, 44, 20); },
  land:  (x, y) => { ctx.fillStyle = '#5b6062'; ctx.fillRect(x, y - 10, 44, 20); },
  isle:  (x, y) => { ctx.fillStyle = '#6d6a63'; ctx.fillRect(x, y - 10, 44, 20); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(x, y - 10, 44, 20); },
  cause: (x, y) => { ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 44, y); ctx.stroke(); ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.stroke(); },
  dike:  (x, y) => { ctx.strokeStyle = C.dike; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 44, y); ctx.stroke(); ctx.strokeStyle = 'rgb(30,48,78)'; ctx.lineWidth = 2.4; ctx.stroke(); },
  sea:   (x, y) => { ctx.strokeStyle = C.ink; ctx.lineWidth = 2.2; ctx.setLineDash([10, 7]); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 44, y); ctx.stroke(); },
  land_route: (x, y) => { ctx.strokeStyle = C.ally; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 44, y); ctx.stroke(); },
  aque:  (x, y) => { ctx.strokeStyle = C.aque; ctx.lineWidth = 2.2; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 44, y); ctx.stroke(); },
  triple:(x, y) => town(ctx, at(x + 22, y), 'triple'),
  other: (x, y) => town(ctx, at(x + 22, y), 'other'),
  ally:  (x, y) => town(ctx, at(x + 22, y), 'ally'),
  battle:(x, y) => town(ctx, at(x + 22, y), 'battle'),
};
function legend(c, x, y, rows) {
  const h = 34 * rows.length + 22, w = 330;
  c.save(); c.fillStyle = 'rgba(7,11,14,0.8)'; c.fillRect(x, y, w, h);
  c.strokeStyle = 'rgba(242,245,246,0.35)'; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w, h); c.restore();
  rows.forEach(([draw, s], i) => {
    const cy = y + 28 + i * 34; c.save(); draw(x + 20, cy); c.restore();
    text(c, s, x + 80, cy + 8, '400 21px "Noto Sans SC"');
  });
}

function instruments(c, title, sub) {
  text(c, title, 48, 70, '500 34px "Noto Sans SC"');
  text(c, sub, 48, 106, '400 21px "IBM Plex Mono"', 'rgba(242,245,246,0.75)');
  text(c, '高度  ' + CFG.alt, W - 48, 64, '400 24px "IBM Plex Mono"', C.ink, 'right');
  const sb = CFG.bar * PX_PER_KM, sx = W - 48 - sb, sy = 112;
  c.save(); c.strokeStyle = C.ink; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(sx, sy - 8); c.lineTo(sx, sy); c.lineTo(sx + sb, sy); c.lineTo(sx + sb, sy - 8); c.stroke(); c.restore();
  text(c, CFG.bar + ' km', sx + sb, sy - 14, '400 21px "IBM Plex Mono"', C.ink, 'right');
  if (VIEW !== 'mexico') {
    c.save(); c.translate(W - 70, 175); c.fillStyle = C.ink;          // 指北
    c.beginPath(); c.moveTo(0, -22); c.lineTo(8, 6); c.lineTo(0, 0); c.lineTo(-8, 6); c.closePath(); c.fill(); c.restore();
    text(c, 'N', W - 70, 215, '400 20px "IBM Plex Mono"', C.ink, 'center');
  }
  CFG.credit.split('\n').reverse().forEach((s, i) => text(c, s, W - 48, H - 30 - i * 24, '400 17px "IBM Plex Mono"', 'rgba(242,245,246,0.75)', 'right'));
}

function drawCity(c) {
  water(c);
  // 岛城：暖一点的陆地色，和湖水分开
  c.save(); path(c, ISLAND, true); c.fillStyle = C.isle; c.fill(); c.restore();
  stroke(c, ISLAND, 2.4, C.ink, { close: true });
  stroke(c, TLATELOLCO_LINE, 1.4, 'rgba(242,245,246,0.8)', { dash: [7, 6], halo: 2 });
  const [px, py] = P(PRECINCT), hw = 0.0019 * W / (BOX.e - BOX.w), hh = 0.0018 * H / (BOX.n - BOX.s);
  c.save(); c.strokeStyle = C.ink; c.lineWidth = 1.6; c.strokeRect(px - hw, py - hh, hw * 2, hh * 2); c.restore();

  stroke(c, AQUEDUCT, 2.4, C.aque, { dash: [8, 6] });
  dike(c, DIKE, 7);
  [CAUSE_TEPEYAC, CAUSE_TLACOPAN, CAUSE_SOUTH, CAUSE_COYOACAN, CAUSE_IZTAPALAPA].forEach(p => causeway(c, p, 5));

  // 水域名称
  text(c, '墨西哥湖', X(-99.170), Y(19.392), '500 30px "Noto Serif SC"', C.water, 'center');
  text(c, '大堤以西 · 较淡的水', X(-99.170), Y(19.392) + 30, '400 19px "Noto Sans SC"', C.water, 'center');

  // 堤道名称
  label(c, [-99.165, 19.444], -30, 60, '特拉科潘堤道（西）', { dot: false });
  label(c, [-99.126, 19.471], -70, -20, '特佩亚克堤道（北）', { dot: false });
  label(c, [-99.1365, 19.398], 70, 18, '伊斯塔帕拉帕堤道（南）', { dot: false });
  label(c, [-99.0915, 19.462], 40, -20, '内萨瓦尔科约特尔大堤', { color: C.dike, dot: false });
  label(c, [-99.180, 19.4245], -30, 70, '查普尔特佩克引水渠', { color: C.aque, dot: false });

  // 岸上的城镇和湖中小岛
  label(c, TOWN.tlacopan, -40, -40, '特拉科潘（三城同盟）');
  label(c, TOWN.tepeyac, 40, -10, '特佩亚克');
  label(c, TOWN.coyoacan, -40, 10, '科约阿坎');
  label(c, TOWN.iztapalapa, 50, 10, '伊斯塔帕拉帕');
  label(c, [-99.0845, 19.4415], 50, 30, '佩尼翁岛', { dot: false });
  label(c, [-99.0298, 19.3775], -40, 40, '特佩波尔科岛', { dot: false });

  instruments(c, '特诺奇蒂特兰和它的堤道', '约 1519 年 · 叠在 2026 年的墨西哥城上 · 示意');
  legend(c, 48, 770, [[sw.fresh, '湖水（较淡）'], [sw.salt, '湖水（咸）'], [sw.isle, '岛城'], [sw.land, '陆地（今天的城区）'],
                      [sw.cause, '堤道：水上的石路'], [sw.dike, '大堤：拦水防洪'], [sw.aque, '引水渠：送淡水进城']]);
}

function drawBasin(c) {
  water(c);
  stroke(c, ISLAND, 1.6, C.ink, { close: true });
  dike(c, DIKE, 4);
  [CAUSE_TEPEYAC, CAUSE_TLACOPAN, CAUSE_SOUTH, CAUSE_COYOACAN, CAUSE_IZTAPALAPA, CAUSE_CUITLAHUAC].forEach(p => causeway(c, p, 2.2));

  // 到特拉斯卡拉的直线距离
  const T = TOWN.tenochtitlan, TL = TOWN.tlaxcala;
  stroke(c, [T, TL], 1.4, 'rgba(255,190,85,0.85)', { dash: [10, 8], halo: 2.5 });
  const km = Math.hypot((TL[0] - T[0]) * KM_LON, (TL[1] - T[1]) * KM_LAT);
  const [mx, my] = P([(T[0] + TL[0]) / 2, (T[1] + TL[1]) / 2]);

  // 城邦
  const towns = [
    ['triple', 'tenochtitlan', 70, 45, '特诺奇蒂特兰', 30, 700],
    ['triple', 'tlacopan', -60, 0, '特拉科潘', 28, 700],
    ['triple', 'texcoco', 60, 0, '特斯科科', 28, 700],

    ['other',  'iztapalapa', 60, 25, '伊斯塔帕拉帕'],
    ['other',  'xochimilco', -60, 0, '霍奇米尔科'],

    ['other',  'ecatepec', 60, -5, '埃卡特佩克'],
    ['other',  'xaltocan', 60, 10, '夏尔托坎（岛城）'],
    ['other',  'zumpango', -60, 0, '宗潘戈'],
    ['other',  'acolman', 60, 0, '阿科尔曼'],
    ['other',  'teotihuacan', 30, -70, '特奥蒂瓦坎（古城遗址）'],
    ['battle', 'otumba', 60, 30, '奥通巴 · 1520 年 7 月战场'],
    ['ally',   'tlaxcala', -60, -40, '特拉斯卡拉（西班牙人的盟友）', 26, 700],
  ];
  towns.forEach(([kind, id, dx, dy, s, size = 23, weight = 400]) => {
    const p = TOWN[id]; town(c, p, kind);

  // 画面外

  text(c, '↓ 乔卢拉 · 韦拉克鲁斯方向', X(-98.303), H - 100, '400 22px "Noto Sans SC"', C.ally, 'center');

  instruments(c, '墨西哥谷地的湖泊与城邦', '约 1519 年 · 示意');
  legend(c, 48, 150, [[sw.fresh, '较淡的湖水'], [sw.salt, '咸湖水'], [sw.cause, '堤道'], [sw.dike, '内萨瓦尔科约特尔大堤'],
                      [sw.triple, '三城同盟'], [sw.other, '其他城邦'], [sw.ally, '西班牙人的盟友'], [sw.battle, '战场']]);
}

// ---------- 大地图：1519 年从古巴到特诺奇蒂特兰 ----------
const STOP = {
  cuba: [-84.95, 21.86], cozumel: [-86.95, 20.42], potonchan: [-92.65, 18.55], ulua: [-96.13, 19.21],
  cempoala: [-96.41, 19.44], xalapa: [-96.92, 19.54], cholula: [-98.303, 19.063], paso: [-98.65, 19.09], amecameca: [-98.77, 19.125],
};
const SEA_ROUTE = [STOP.cuba, [-86.1,21.1], STOP.cozumel, [-86.75,21.0], [-87.05,21.75], [-88.6,21.6], [-90.1,21.2], [-90.75,20.3],
  [-91.1,19.3], [-92.0,18.85], STOP.potonchan, [-93.4,18.6], [-94.4,18.35], [-95.3,18.85], STOP.ulua];
const LAND_ROUTE = [STOP.ulua, STOP.cempoala, STOP.xalapa, [-97.25,19.62], [-97.66,19.72], TOWN.tlaxcala, STOP.cholula,
  STOP.paso, STOP.amecameca, TOWN.iztapalapa, TOWN.tenochtitlan];
function drawMexico(c) {
  const km = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot((p[0] - pts[i][0]) * KM_LON, (p[1] - pts[i][1]) * KM_LAT), 0);
  // 海名、地名
  text(c, '墨西哥湾', X(-93.3), Y(22.6), '500 48px "Noto Serif SC"', 'rgba(200,225,250,0.92)', 'center');
  text(c, '加勒比海', X(-85.6), Y(18.2), '500 40px "Noto Serif SC"', 'rgba(200,225,250,0.92)', 'center');
  text(c, '太平洋', X(-97.3), Y(15.3), '500 40px "Noto Serif SC"', 'rgba(200,225,250,0.92)', 'center');
  text(c, '尤卡坦半岛', X(-89.2), Y(20.5), 'italic 500 28px "Noto Sans SC"', 'rgba(242,245,246,0.85)', 'center');
  text(c, '古巴', X(-84.0), Y(22.55), 'italic 500 28px "Noto Sans SC"', 'rgba(242,245,246,0.85)', 'center');
  text(c, '东马德雷山脉', X(-99.9), Y(22.2), 'italic 400 24px "Noto Sans SC"', 'rgba(242,245,246,0.8)', 'center');
  text(c, '墨西哥中央高原', X(-101.2), Y(21.3), 'italic 400 24px "Noto Sans SC"', 'rgba(242,245,246,0.8)', 'center');

  // 图 2 的范围
  const [bx0, by0] = P([-99.43, 19.86]), [bx1, by1] = P([-98.19, 19.20]);
  c.save(); c.strokeStyle = 'rgba(242,245,246,0.85)'; c.lineWidth = 1.4; c.setLineDash([5, 4]);
  c.strokeRect(bx0, by0, bx1 - bx0, by1 - by0); c.restore();
  text(c, '图 2 范围', bx0, by0 - 8, '400 18px "Noto Sans SC"', 'rgba(242,245,246,0.85)');

  // 路线：海上虚线，陆上实线
  stroke(c, SEA_ROUTE, 2.2, C.ink, { dash: [10, 7], halo: 3 });
  stroke(c, LAND_ROUTE, 3, C.ally, { halo: 3 });
  [STOP.cuba, STOP.cozumel, STOP.potonchan, STOP.ulua, STOP.cempoala].forEach(p => town(c, p, 'other'));
  town(c, STOP.cholula, 'battle'); town(c, TOWN.tlaxcala, 'ally'); town(c, TOWN.tenochtitlan, 'triple');

  label(c, STOP.cuba, -40, -70, '1519 年 2 月 · 从古巴西端启航', { dot: false });
  label(c, STOP.cozumel, -40, 80, '科苏梅尔岛 · 找回翻译阿吉拉尔', { dot: false });
  label(c, STOP.potonchan, 20, 80, '波通昌 · 3 月首战，得到翻译玛林切', { dot: false });
  label(c, STOP.ulua, 40, 120, '4 月登陆 · 建韦拉克鲁斯', { dot: false });
  label(c, STOP.cempoala, 30, -80, '森波阿拉 · 与托托纳克人结盟', { dot: false });
  label(c, TOWN.tlaxcala, 60, 60, '特拉斯卡拉 · 9 月先战后盟', { dot: false, color: C.ally, weight: 500 });
  label(c, STOP.cholula, -10, 100, '乔卢拉 · 10 月大屠杀', { dot: false, color: C.ally });
  label(c, TOWN.tenochtitlan, 10, -120, '特诺奇蒂特兰 · 11 月 8 日入城', { dot: false, weight: 700, size: 26 });

  // 读数：陆上行军的路程
  const rx = 1180, ry = 820, d = km(LAND_ROUTE);
  text(c, '从海边到湖上之城 · 陆路', rx, ry, '400 26px "Noto Sans SC"');
  text(c, '≈' + Math.round(d / 10) * 10, rx - 4, ry + 104, '300 112px "Barlow Condensed"', C.ally);
  c.font = '300 112px "Barlow Condensed"';
  text(c, 'km', rx - 4 + c.measureText('≈' + Math.round(d / 10) * 10).width + 10, ry + 104, '300 50px "Barlow Condensed"', C.ally);
  text(c, '1519 年 8 月 16 日出发 → 11 月 8 日入城 · 沿推测路线测算', rx, ry + 144, '400 21px "Noto Sans SC"', 'rgba(242,245,246,0.8)');

  instruments(c, '1519 年：从古巴到特诺奇蒂特兰', '虚线 · 海路    实线 · 陆路行军');
  legend(c, 48, 800, [[sw.sea, '海路'], [sw.land_route, '陆路行军'], [sw.triple, '阿兹特克首都'], [sw.ally, '西班牙人的盟友'],
                      [sw.battle, '屠杀 / 战斗'], [sw.other, '途经地点']]);
}

async function draw() {
  await document.fonts.ready;
  for (const f of ['300 112px "Barlow Condensed"', 'italic 500 28px "Noto Sans SC"', '400 24px "Noto Sans SC"', '700 32px "Noto Sans SC"', '500 40px "Noto Serif SC"', '400 22px "IBM Plex Mono"'])
    await document.fonts.load(f, '特斯科科湖 0123456789 km');
  const img = new Image(); img.src = CFG.img; await img.decode();
  const c = ctx = document.getElementById('c').getContext('2d');
  if (VIEW === 'mexico') {                 // 轨道高度：真彩色，只压暗一点让标注读得清
    c.drawImage(img, 0, 0, W, H); c.fillStyle = 'rgba(7,11,14,0.22)'; c.fillRect(0, 0, W, H);
    drawMexico(c); return;
  }
  c.drawImage(grade(img), 0, 0);
  DEM = await loadDEM(); buildMask();
  (VIEW === 'basin' ? drawBasin : drawCity)(c);
}
let done = draw();
window.READY = true;
window.render = async () => { await done; };
</script></body></html>
